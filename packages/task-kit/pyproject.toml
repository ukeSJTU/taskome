[project]
name = "task-kit"
version = "0.1.0"
description = "Shared synchronous REST and MCP runtime for Taskome Task Servers"
readme = "README.md"
authors = [{ name = "ukeSJTU", email = "uke_sjtu@sjtu.edu.cn" }]
requires-python = ">=3.14"
dependencies = [
  "anyio>=4.14.2",
  "boto3>=1.43.69",
  "fastapi[standard]>=0.141.1",
  "fastmcp==4.0.0b2",
  "httpx>=0.28.1",
  "pydantic>=2",
  "pydantic-settings>=2.15.0",
  "structlog>=25.5.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0", "pytest-mock>=3.15.1"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
