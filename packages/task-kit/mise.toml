[tasks.lint]
description = "Lint task-kit (safe autofixes)"
run = "uv run ruff check --fix"

[tasks.format]
description = "Format task-kit"
run = "uv run ruff format"

[tasks.check]
description = "Read-only check: lint, format, types"
run = ["uv run ruff check", "uv run ruff format --check", "uv run ty check src"]

[tasks.test]
description = "Smoke-test the task-kit public API. TODO: change to pytest later"
run = '''
uv run python -c '
from task_kit import register_task
try:
    register_task()
except NotImplementedError as error:
    assert str(error) == "task-kit registration is not implemented yet"
else:
    raise AssertionError("register_task must raise NotImplementedError")
'
'''
