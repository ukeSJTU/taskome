[tasks.lint]
description = "Lint task-kit (safe autofixes)"
hide = true
run = "uv run ruff check --fix"

[tasks.format]
description = "Format task-kit"
hide = true
run = "uv run ruff format"

[tasks.check]
description = "Read-only check: lint, format, types"
hide = true
run = ["uv run ruff check", "uv run ruff format --check", "uv run ty check src"]

[tasks."test:unit"]
description = "Run task-kit unit contract tests"
hide = true
run = "uv run pytest tests/unit"

[tasks."test:integration"]
description = "Run task-kit production boundary integration tests"
hide = true
run = "uv run pytest tests/integration"

[tasks.test]
description = "Run all task-kit contract tests"
hide = true
run = ["uv run pytest tests/unit", "uv run pytest tests/integration"]
