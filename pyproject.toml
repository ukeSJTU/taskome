[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
lint = ["ruff", "ty"]
test = ["pytest", "pytest-cov", "testcontainers[postgres]>=4,<5"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["apps/gateway", "packages/task-kit"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["references"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "ISC001", "CPY001"]

[tool.ruff.lint.per-file-ignores]
"apps/gateway/alembic/**" = ["INP001"]
"apps/gateway/tests/**" = ["S101", "PLR2004", "ANN001", "ANN201", "INP001"]

[tool.ty.src]
exclude = ["references", ".agents"]

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
norecursedirs = ["references"]
