name: taskome

# Combined with compose.yml this is a local production-shape rehearsal, not a deployable production stack: it still inherits dev-support services and their loopback ports.
include:
  - infra/ray.yml

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      BETTER_AUTH_URL: http://localhost:3000
      GATEWAY_INTERNAL_URL: http://gateway:8000
      AUTH_TRUSTED_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/taskome
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    env_file:
      - path: apps/gateway/.env
        required: false
    environment:
      APP_ENVIRONMENT: production
      AUTH_JWKS_URL: http://web:3000/api/auth/jwks
      AUTH_ISSUER: http://localhost:3000
      AUTH_OAUTH_ISSUER: http://localhost:3000/api/auth
      AUTH_SESSION_AUDIENCE: http://localhost:3000
      AUTH_OAUTH_AUDIENCE: http://gateway:8000
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/taskome
      RATE_LIMIT_REDIS_URL: redis://redis-rate-limit:6379/0
    depends_on:
      gateway-migrate:
        condition: service_completed_successfully
      redis-rate-limit:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  gateway-migrate:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    environment:
      APP_ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/taskome
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "gateway.db.commands", "migrate"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
