# Remeber to run `mise lock` after changing this file to update the lockfile.
monorepo_root = true

[monorepo]
config_roots = ["apps/gateway"]

[tools]
node = "24"
python = "3.14"
pnpm = "11"
uv = "latest"
lefthook = "2"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]
python.uv_venv_auto = "source"

[env]
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[hooks]
postinstall = "lefthook install"

[tasks.dev]
description = "Start all apps in development mode"
run = "pnpm run dev"
output = "prefix"

[tasks."ts:lint"]
run = "pnpm run lint"

[tasks."ts:format"]
run = "pnpm run format"

[tasks."ts:check"]
run = "pnpm run check"

[tasks."ts:test"]
run = "pnpm run test"

[tasks.lint]
description = "Lint the whole repo (TS + Python), safe autofixes"
depends = ["ts:lint", "//apps/gateway:lint"]

[tasks.format]
description = "Format the whole repo (TS + Python)"
depends = ["ts:format", "//apps/gateway:format"]

[tasks.check]
description = "Read-only check across the whole repo (lint + format + types)"
depends = ["ts:check", "//apps/gateway:check"]

[tasks.test]
description = "Run tests across the repo"
depends = ["ts:test", "//apps/gateway:test"]
output = "prefix"

[tasks."db:start"]
description = "Start the postgres container in the background"
run = "docker compose up -d postgres"

[tasks."docker:build"]
description = "Build the Docker Compose images"
run = "docker compose build"

[tasks."docker:up"]
description = "Build and start the Docker Compose stack"
run = "docker compose up -d --build"

[tasks."docker:down"]
description = "Stop the Docker Compose stack"
run = "docker compose down"

[tasks."docker:logs"]
description = "Tail logs from the Docker Compose stack"
run = "docker compose logs -f"

[tasks."worktree:create"]
description = "Create a feature worktree from origin/main"
usage = '''
arg "<type>" help="Branch type: feat, fix, or chore"
arg "<slug>" help="Lowercase kebab-case feature name"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

case "$usage_type" in
  feat | fix | chore) ;;
  *) echo "Invalid type: $usage_type. Use feat, fix, or chore." >&2; exit 1 ;;
esac

if [[ ! "$usage_slug" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
  echo "Invalid slug: $usage_slug. Use lowercase kebab-case." >&2
  exit 1
fi

repo_root="$(git rev-parse --show-toplevel)"
cd "$repo_root"
branch="$usage_type/$usage_slug"
worktree=".worktrees/$usage_slug"

if git show-ref --verify --quiet "refs/heads/$branch"; then
  echo "Branch already exists: $branch" >&2
  exit 1
fi

if [[ -e "$worktree" ]]; then
  echo "Worktree path already exists: $worktree" >&2
  exit 1
fi

git fetch origin main
git worktree add -b "$branch" "$worktree" origin/main
'''

[tasks."worktree:remove"]
description = "Remove a clean feature worktree and its local branch"
usage = '''
arg "<type>" help="Branch type: feat, fix, or chore"
arg "<slug>" help="Lowercase kebab-case feature name"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

case "$usage_type" in
  feat | fix | chore) ;;
  *) echo "Invalid type: $usage_type. Use feat, fix, or chore." >&2; exit 1 ;;
esac

if [[ ! "$usage_slug" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
  echo "Invalid slug: $usage_slug. Use lowercase kebab-case." >&2
  exit 1
fi

repo_root="$(git rev-parse --show-toplevel)"
cd "$repo_root"
branch="$usage_type/$usage_slug"
worktree=".worktrees/$usage_slug"

if [[ ! -d "$worktree" ]]; then
  echo "Worktree does not exist: $worktree" >&2
  exit 1
fi

if [[ -n "$(git -C "$worktree" status --porcelain)" ]]; then
  echo "Worktree has uncommitted changes: $worktree" >&2
  exit 1
fi

git worktree remove "$worktree"
git branch -d "$branch"
'''

[tasks."ref:sync"]
description = "Sync submodule config and checkout the pinned reference revisions"
run = [
  "git submodule sync --recursive",
  "git submodule update --init --recursive --recommend-shallow",
]

[tasks."ref:status"]
description = "Show the current reference submodule revisions"
run = "git submodule status --recursive"

[tasks."ref:reset"]
description = "Discard all local changes in reference submodules, restoring them to read-only pinned state"
run = "git submodule foreach --recursive 'git clean -fdx && git checkout -- .'"
