# Remeber to run `mise lock` after changing this file to update the lockfile.
monorepo_root = true

[monorepo]
config_roots = ["apps/gateway", "apps/docs", "packages/task-kit"]

[tools]
node = "24"
python = "3.14"
pnpm = "11"
uv = "latest"
lefthook = "2"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]
python.uv_venv_auto = "source"

[env]
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[tasks.setup]
description = "Install locked project dependencies, initialize local env files, and install Git hooks"
run = [
  "pnpm install --frozen-lockfile",
  "uv sync --locked",
  "mise run env:init",
  "lefthook install",
]

[tasks."env:init"]
description = "Create missing local Web and Gateway environment files without overwriting configuration"
run = "bash scripts/init-local-env.sh"

[tasks.dev]
description = "Start all apps in development mode"
depends = ["web:dev", "gateway:dev", "docs:dev"]
output = "prefix"

[tasks."web:dev"]
description = "Run Web in development mode on port 3000"
run = "pnpm --dir apps/web run dev"

[tasks."gateway:dev"]
description = "Run Gateway with development reload on port 8000"
run = "mise run //apps/gateway:dev"

[tasks."docs:dev"]
description = "Run Docs in development mode on port 3001"
run = "pnpm --dir apps/docs run dev"

[tasks.build]
description = "Build the Web and Docs applications"
depends = ["web:build", "docs:build"]
output = "prefix"

[tasks."web:build"]
description = "Build Web"
run = "pnpm --dir apps/web run build"

[tasks."docs:build"]
description = "Build Docs"
run = "pnpm --dir apps/docs run build"

[tasks."web:start"]
description = "Run the production Web server on port 3000"
run = "pnpm --dir apps/web run start"

[tasks."docs:start"]
description = "Run the production Docs server on port 3001"
run = "pnpm --dir apps/docs run start"

[tasks."web:check-types"]
description = "Type-check Web"
run = "pnpm --dir apps/web run check-types"

[tasks."docs:check-types"]
description = "Type-check Docs"
run = "pnpm --dir apps/docs run check-types"

[tasks."web:test"]
description = "Run Web tests"
run = "pnpm --dir apps/web run test"

[tasks."web:test:watch"]
description = "Run Web tests in watch mode"
run = "pnpm --dir apps/web run test:watch"

[tasks."web:test:coverage"]
description = "Run Web tests with coverage"
run = "pnpm --dir apps/web run test:coverage"

[tasks."web:db:push"]
description = "Push the Web-owned Drizzle schema"
run = "pnpm --filter @taskome/db run db:push"

[tasks."web:db:generate"]
description = "Generate Web-owned Drizzle migrations"
run = "pnpm --filter @taskome/db run db:generate"

[tasks."web:db:migrate"]
description = "Apply Web-owned Drizzle migrations"
run = "pnpm --filter @taskome/db run db:migrate"

[tasks."web:db:studio"]
description = "Open the Web-owned Drizzle Studio"
run = "pnpm --filter @taskome/db run db:studio"

[tasks."gateway:start"]
description = "Run Gateway in production mode on port 8000"
run = "mise run //apps/gateway:start"

[tasks."gateway:lint"]
description = "Lint Gateway with safe autofixes"
run = "mise run //apps/gateway:lint"

[tasks."gateway:format"]
description = "Format Gateway"
run = "mise run //apps/gateway:format"

[tasks."gateway:check"]
description = "Run read-only Gateway checks"
run = "mise run //apps/gateway:check"

[tasks."gateway:test"]
description = "Run all Gateway tests"
run = "mise run //apps/gateway:test"

[tasks."gateway:test:unit"]
description = "Run Gateway unit tests"
run = "mise run //apps/gateway:test:unit"

[tasks."gateway:test:integration"]
description = "Run Gateway integration tests"
run = "mise run //apps/gateway:test:integration"

[tasks."gateway:db:migrate"]
description = "Apply Gateway Alembic migrations"
run = "mise run //apps/gateway:db:migrate"

[tasks."gateway:db:revision"]
description = "Generate a Gateway Alembic revision"
run = "mise run //apps/gateway:db:revision"

[tasks."gateway:openapi:export"]
description = "Export Gateway OpenAPI"
run = "mise run //apps/gateway:openapi:export"

[tasks."ts:lint"]
hide = true
run = "pnpm exec oxlint --fix"

[tasks."ts:format"]
hide = true
run = "pnpm exec oxfmt --write"

[tasks."ts:check"]
hide = true
run = ["pnpm exec oxlint", "pnpm exec oxfmt --check", "pnpm -r run check-types"]

[tasks."ts:test"]
hide = true
run = "pnpm -r run test"

[tasks."test:browser-e2e"]
description = "Run the isolated Chromium Browser E2E suite"
run = "bash scripts/browser-e2e.sh"

[tasks."test:browser-e2e:ui"]
description = "Run Browser E2E interactively in the Playwright UI"
run = "bash scripts/browser-e2e.sh --ui"

[tasks."test:browser-e2e:debug"]
description = "Run Browser E2E headed with the Playwright Inspector"
run = "bash scripts/browser-e2e.sh --debug"

[tasks."test:mcp-oauth-contract"]
description = "Temporary cross-language OAuth/MCP contract test; replace with Playwright E2E"
run = "bash scripts/test-mcp-oauth-contract.sh"

[tasks."deps:outdated"]
description = "Report available dependency and tool updates without changing lockfiles"
run = "bash scripts/deps-outdated.sh"

[tasks."api-client:generate"]
description = "Refresh the generated authenticated gateway client"
run = ["mise run gateway:openapi:export", "pnpm --filter @taskome/api-client generate"]

[tasks."api-client:verify"]
description = "Regenerate the API client and require no uncommitted generated changes"
run = [
  "mise run //:api-client:generate",
  "git diff --exit-code -- packages/api-client/openapi.json packages/api-client/src/generated",
]

[tasks.lint]
description = "Lint the whole repo (TS + Python), safe autofixes"
depends = ["ts:lint", "gateway:lint", "//packages/task-kit:lint"]
output = "prefix"

[tasks.format]
description = "Format the whole repo (TS + Python)"
depends = ["ts:format", "gateway:format", "//packages/task-kit:format"]
output = "prefix"

[tasks.check]
description = "Read-only check across the whole repo (lint + format + types)"
depends = ["ts:check", "gateway:check", "//packages/task-kit:check"]
output = "prefix"

[tasks.test]
description = "Run tests across the repo"
depends = ["ts:test", "gateway:test", "//packages/task-kit:test"]
output = "prefix"

[tasks."dev:up"]
description = "Start and wait for dev-support services (PostgreSQL, Redis, SeaweedFS, otel-gui)"
run = "docker compose up -d --wait"

[tasks."dev:down"]
description = "Stop dev-support services without removing volumes"
run = "docker compose down"

[tasks."dev:logs"]
description = "Tail logs from dev-support services"
run = "docker compose logs -f"

[tasks."prod:build"]
description = "Build the production-shaped stack's images (Web, Docs, Gateway)"
run = "docker compose -f compose.yml -f compose.prod.yml build"

[tasks."prod:up"]
description = "Build, start, and wait for the production-shaped stack (Web, Docs, Gateway, infrastructure)"
run = "docker compose -f compose.yml -f compose.prod.yml up -d --build --wait"

[tasks."prod:down"]
description = "Stop the production-shaped stack"
run = "docker compose -f compose.yml -f compose.prod.yml down"

[tasks."prod:logs"]
description = "Tail logs from the production-shaped stack"
run = "docker compose -f compose.yml -f compose.prod.yml logs -f"

[tasks."worktree:create"]
description = "Create a feature worktree from origin/main"
usage = '''
arg "<type>" help="Branch type: feat, fix, or chore"
arg "<slug>" help="Lowercase kebab-case feature name"
'''
run = "bash scripts/create-worktree.sh"

[tasks."worktree:remove"]
description = "Remove a clean feature worktree and its local branch"
usage = '''
arg "<type>" help="Branch type: feat, fix, or chore"
arg "<slug>" help="Lowercase kebab-case feature name"
'''
run = "bash scripts/remove-worktree.sh"

[tasks."ref:sync"]
description = "Sync submodule config and checkout the pinned reference revisions"
run = [
  "git submodule sync --recursive",
  "git submodule update --init --recursive --recommend-shallow",
]

[tasks."ref:status"]
description = "Show the current reference submodule revisions"
run = "git submodule status --recursive"

[tasks."ref:reset"]
description = "Discard all local changes in reference submodules, restoring them to read-only pinned state"
run = "git submodule foreach --recursive 'git clean -fdx && git checkout -- .'"
