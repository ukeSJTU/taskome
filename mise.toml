# Remember to run `mise lock` after changing this file to update the lockfile.
monorepo_root = true

[monorepo]
config_roots = [
  "apps/cli",
  "apps/docs",
  "apps/gateway",
  "apps/task-fpocket",
  "apps/web",
  "packages/api-client",
  "packages/db",
  "packages/task-kit",
]

[tools]
go = "1.26.6"
"go:honnef.co/go/tools/cmd/staticcheck" = "0.7.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"
node = "24"
python = "3.14"
pnpm = "11"
uv = "latest"
lefthook = "2"
"npm:@modelcontextprotocol/inspector" = { version = "2.2.0", trust_policy_excludes = [
  "pino@9.14.0",
] }

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]
python.uv_venv_auto = "source"

[env]
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }
_.path = ["apps/cli/bin"]

[tasks.setup]
description = "Install locked project dependencies, initialize local env files, and install Git hooks"
depends = ["//apps/task-fpocket:sync"]
run = [
  "pnpm install --frozen-lockfile",
  "uv sync --locked",
  "go -C apps/cli mod download",
  "mise run env:init",
  "lefthook install",
]

[tasks."env:init"]
description = "Create missing local Web and Gateway environment files without overwriting configuration"
run = "bash scripts/init-local-env.sh"

[tasks.dev]
description = "Start all apps in development mode"
depends = ["//apps/web:dev", "//apps/gateway:dev", "//apps/docs:dev"]
output = "prefix"

[tasks.build]
description = "Build CLI, Web, and Docs"
depends = ["//apps/cli:build", "//apps/web:build", "//apps/docs:build"]
output = "prefix"

[tasks."ts:lint"]
hide = true
run = "pnpm exec oxlint --fix"

[tasks."ts:format"]
hide = true
run = "pnpm exec oxfmt --write"

[tasks."ts:check"]
hide = true
run = ["pnpm exec oxlint", "pnpm exec oxfmt --check", "pnpm -r run check-types"]

[tasks."ts:test"]
hide = true
run = "pnpm -r run test"

[tasks."test:browser-e2e"]
description = "Run the isolated Chromium Browser E2E suite"
run = "bash scripts/browser-e2e.sh"

[tasks."test:browser-e2e:ui"]
description = "Run Browser E2E interactively in the Playwright UI"
hide = true
run = "bash scripts/browser-e2e.sh --ui"

[tasks."test:browser-e2e:debug"]
description = "Run Browser E2E headed with the Playwright Inspector"
hide = true
run = "bash scripts/browser-e2e.sh --debug"

[tasks."deps:outdated"]
description = "Report available dependency and tool updates without changing lockfiles"
run = "bash scripts/deps-outdated.sh"

[tasks."openapi:generate"]
description = "Export Gateway OpenAPI and regenerate the TypeScript and Go clients"
depends = ["//packages/api-client:generate", "//apps/cli:api-client:generate"]
output = "prefix"

[tasks."openapi:verify"]
description = "Regenerate Gateway clients and require all checked-in generated files to be current"
run = '''
#!/usr/bin/env bash
set -euo pipefail

mise run --force //:openapi:generate

generated_status="$(git status --porcelain --untracked-files=all -- \
  packages/api-client/openapi.json \
  packages/api-client/src/generated \
  apps/cli/internal/gateway/generated)"

if [[ -n "$generated_status" ]]; then
  printf '%s\n' "Generated Gateway clients are out of date:" "$generated_status"
  exit 1
fi
'''

[tasks.lint]
description = "Lint the whole repo (TS + Python), safe autofixes"
depends = ["ts:lint", "//apps/gateway:lint", "//apps/task-fpocket:lint", "//packages/task-kit:lint"]
output = "prefix"

[tasks.format]
description = "Format the whole repo (Go + TS + Python)"
depends = [
  "ts:format",
  "//apps/cli:format",
  "//apps/gateway:format",
  "//apps/task-fpocket:format",
  "//packages/task-kit:format",
]
output = "prefix"

[tasks.check]
description = "Read-only check across the whole repo (Go + TS + Python)"
depends = [
  "//apps/cli:check",
  "ts:check",
  "//apps/gateway:check",
  "//apps/task-fpocket:check",
  "//packages/task-kit:check",
]
output = "prefix"

[tasks.test]
description = "Run tests across the repo"
depends = [
  "//apps/cli:test",
  "ts:test",
  "//apps/gateway:test",
  "//apps/task-fpocket:test",
  "//packages/task-kit:test",
]
output = "prefix"

[tasks."dev:up"]
description = "Start and wait for dev-support services (PostgreSQL, Redis, SeaweedFS, otel-gui)"
run = "docker compose up -d --wait"

[tasks."dev:down"]
description = "Stop dev-support services without removing volumes"
run = "docker compose down"

[tasks."dev:logs"]
description = "Tail logs from dev-support services"
run = "docker compose logs -f"

[tasks."prod:build"]
description = "Build the production-shaped stack's images (Web, Docs, Gateway)"
run = "docker compose -f compose.yml -f compose.prod.yml build"

[tasks."prod:up"]
description = "Build, start, and wait for the production-shaped stack (Web, Docs, Gateway, infrastructure)"
run = "docker compose -f compose.yml -f compose.prod.yml up -d --build --wait"

[tasks."prod:down"]
description = "Stop the production-shaped stack"
run = "docker compose -f compose.yml -f compose.prod.yml down"

[tasks."prod:logs"]
description = "Tail logs from the production-shaped stack"
run = "docker compose -f compose.yml -f compose.prod.yml logs -f"

[tasks."worktree:create"]
description = "Create a feature worktree from origin/main"
hide = true
usage = '''
arg "<type>" help="Branch type: feat, fix, or chore"
arg "<slug>" help="Lowercase kebab-case feature name"
'''
run = "bash scripts/create-worktree.sh"

[tasks."worktree:remove"]
description = "Remove a clean feature worktree and its local branch"
hide = true
usage = '''
arg "<type>" help="Branch type: feat, fix, or chore"
arg "<slug>" help="Lowercase kebab-case feature name"
'''
run = "bash scripts/remove-worktree.sh"

[tasks."ref:sync"]
description = "Sync submodule config and checkout the pinned reference revisions"
hide = true
run = [
  "git submodule sync --recursive",
  "git submodule update --init --recursive --recommend-shallow",
]

[tasks."ref:status"]
description = "Show the current reference submodule revisions"
hide = true
run = "git submodule status --recursive"

[tasks."ref:reset"]
description = "Discard all local changes in reference submodules, restoring them to read-only pinned state"
hide = true
run = "git submodule foreach --recursive 'git clean -fdx && git checkout -- .'"

[tasks."mcp:inspect"]
description = "Open MCP Inspector for the local Gateway"
run = "env -u http_proxy -u https_proxy mcp-inspector --web --config .mcp/inspector.json"
