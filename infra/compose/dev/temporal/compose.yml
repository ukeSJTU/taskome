services:
  temporal:
    image: temporalio/temporal:1.8.2
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /home/temporal/temporal.db
      - --namespace
      - taskome
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - temporal
        - operator
        - cluster
        - health
        - --address
        - 127.0.0.1:7233
      interval: 2s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - execution_temporal_data:/home/temporal

volumes:
  execution_temporal_data:
