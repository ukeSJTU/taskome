services:
  redis-taskiq:
    image: redis:8.4-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - taskome_redis_taskiq_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379" # dev-only: native Gateway readiness checks reach it locally
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  taskome_redis_taskiq_data:
