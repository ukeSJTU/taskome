services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: taskome
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: e2e-password
    ports:
      - "127.0.0.1:${E2E_POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskome"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:8.4-alpine
    ports:
      - "127.0.0.1:${E2E_REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:3.93
    command: server -dir=/data -s3
    ports:
      - "127.0.0.1:${E2E_SEAWEED_PORT}:8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9333/cluster/status"]
      interval: 2s
      timeout: 2s
      retries: 30
