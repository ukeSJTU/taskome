name: taskome

include:
  - infra/redis.yml
  - infra/ray.yml
  - infra/seaweedfs.yml
  - infra/otel-gui.yml

services:
  postgres:
    image: postgres:18
    container_name: taskome-postgres
    environment:
      POSTGRES_DB: taskome
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "127.0.0.1:5432:5432" # dev-only: host tools (psql, Drizzle Studio) reach it locally
    volumes:
      - taskome_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  task-fpocket:
    # The vendored fpocket build links a pre-built LINUXAMD64 molfile plugin
    # archive (see compute/plugins/LINUXAMD64) -- it only builds for amd64,
    # matching `mise run //apps/task-fpocket:build`'s explicit --platform.
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/task-fpocket/Dockerfile
    env_file:
      - path: apps/task-fpocket/.env
        required: false
    environment:
      # Gateway runs natively in dev (`mise run dev`), not in this Compose network --
      # host.docker.internal reaches it from inside the container for Input File
      # resolution callbacks (ADR-0007).
      GATEWAY_INTERNAL_URL: http://host.docker.internal:8000
      GATEWAY_TASK_HMAC_SECRET: ${GATEWAY_TASK_HMAC_SECRET:-taskome-local-fpocket-gateway-hmac-secret}
      SEAWEEDFS_INTERNAL_ENDPOINT: http://seaweedfs:8333
      SEAWEEDFS_ACCESS_KEY: taskome-dev
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-taskome-dev-secret-change-me}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:18000:8000" # dev-only: manual signed-request verification (see scripts/sign-internal-request.py)
    depends_on:
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  gateway-worker:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/taskome
      REDIS_URL: redis://redis-taskiq:6379/0
      RAY_ADDRESS: ray://ray-head:10001
      FPOCKET_INTERNAL_URL: http://task-fpocket:8000
      FPOCKET_TASK_HMAC_SECRET: ${GATEWAY_TASK_HMAC_SECRET:-taskome-local-fpocket-gateway-hmac-secret}
    command:
      ["taskiq", "worker", "gateway.worker:broker", "--ack-type", "when_received", "--workers", "1"]
    depends_on:
      postgres:
        condition: service_healthy
      redis-taskiq:
        condition: service_healthy
      ray-head:
        condition: service_started
      task-fpocket:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  taskome_postgres_data:
