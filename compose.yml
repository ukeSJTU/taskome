services:
  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: taskome
      POSTGRES_PASSWORD: taskome
      POSTGRES_USER: taskome
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskome -d taskome"]
      interval: 2s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    shm_size: 128mb
    volumes:
      - server_postgres_data:/var/lib/postgresql

volumes:
  server_postgres_data:
