[project]
name = "gateway"
version = "0.1.0"
description = "Taskome computing platform REST and MCP gateway"
authors = [{ name = "ukeSJTU", email = "uke_sjtu@sjtu.edu.cn" }]
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.17,<1.18",
  "boto3>=1.42,<2",
  "fastapi[standard]>=0.141.1",
  "fastmcp==4.0.0b2",
  "gunicorn>=26,<27",
  "httpx>=0.28.1",
  "httpx2>=2.10,<3",
  "jsonschema>=4.26.0",
  "opentelemetry-exporter-otlp-proto-http>=1.44.0",
  "opentelemetry-instrumentation-fastapi>=0.65b0",
  "opentelemetry-instrumentation-logging>=0.65b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
  "opentelemetry-sdk>=1.44.0",
  "psycopg[binary]>=3,<4",
  "pyjwt[crypto]>=2.10,<3",
  "redis>=7.4,<8",
  "scalar-fastapi>=1.8,<2",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "structlog>=25.5.0",
  "task-kit",
  "uvicorn-worker>=0.4,<0.5",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "gateway.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=gateway", "--cov-report=term-missing", "--strict-markers"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/gateway"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.uv.sources]
task-kit = { workspace = true, editable = true }
