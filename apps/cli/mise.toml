[tasks.build]
description = "Build the Taskome CLI binary"
hide = true
run = ["mkdir -p bin", "go build -o bin/taskome ./cmd/taskome"]

[tasks.run]
description = "Run the Taskome CLI from source"
hide = true
usage = '''
arg "[args]..." help="Arguments passed to taskome"
'''
run = "go run ./cmd/taskome $usage_args"

[tasks.check]
description = "Run read-only Taskome CLI checks"
hide = true
run = ["test -z \"$(gofmt -l .)\"", "go vet ./..."]

[tasks.test]
description = "Run Taskome CLI tests"
hide = true
run = "go test ./..."

[tasks."api-client:generate"]
description = "Generate the Taskome CLI Gateway client from OpenAPI"
hide = true
run = "go tool oapi-codegen --config oapi-codegen.yaml ../../packages/api-client/openapi.json"
