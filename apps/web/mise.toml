[tasks.dev]
description = "Run Web in development mode on port 3000"
run = "pnpm run dev"

[tasks.build]
description = "Build Web for production"
run = "pnpm run build"

[tasks.start]
description = "Run the production Web server on port 3000"
run = "pnpm run start"

[tasks."check-types"]
description = "Type-check Web"
run = "pnpm run check-types"

[tasks.test]
description = "Run Web tests"
run = "pnpm run test"

[tasks."test:watch"]
description = "Run Web tests in watch mode"
run = "pnpm run test:watch"

[tasks."test:coverage"]
description = "Run Web tests with coverage"
run = "pnpm run test:coverage"
