[env]
# Ignore the monorepo's activated virtual environment so uv selects this
# project's own .venv.
VIRTUAL_ENV = false

[tasks.sync]
description = "Synchronize the fpocket Task Server environment"
run = "uv sync --locked --all-groups"

[tasks.build]
description = "Build the fpocket Task Server image"
run = "docker build --platform linux/amd64 --file Dockerfile --tag taskome/task-fpocket:dev ../.."

[tasks.lint]
description = "Lint fpocket Task Server (safe autofixes)"
run = "uv run ruff check --fix"

[tasks.format]
description = "Format fpocket Task Server"
run = "uv run ruff format"

[tasks.check]
description = "Read-only check: lint, format, types"
run = ["uv run ruff check", "uv run ruff format --check", "uv run ty check src"]

[tasks."compute:build"]
description = "Build the native fpocket binary for local/CI tests (not the Docker image)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

case "$(uname -s)-$(uname -m)" in
  Linux-x86_64) arch=LINUXAMD64 ;;
  Darwin-arm64) arch=MACOSXARM64 ;;
  Darwin-x86_64) arch=MACOSXX86_64 ;;
  *)
    echo "Unsupported platform for a native fpocket build: $(uname -s)-$(uname -m)" >&2
    exit 1
    ;;
esac

mkdir -p compute/bin compute/obj
make -C compute ARCH="$arch" fpocket
'''

[tasks.test]
description = "Run the fpocket Task Server test suite"
depends = ["compute:build"]
run = "uv run pytest"
