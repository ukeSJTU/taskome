name: CI / OpenAPI contract

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify generated clients
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Resolve Go cache paths
        id: go-cache-paths
        run: |
          set -Eeuo pipefail
          printf 'build=%s\n' "$(go env GOCACHE)" >>"$GITHUB_OUTPUT"
          printf 'modules=%s\n' "$(go env GOMODCACHE)" >>"$GITHUB_OUTPUT"
      - name: Restore Go caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.modules }}
          key: go-${{ runner.os }}-${{ hashFiles('apps/cli/go.sum', 'mise.lock') }}
      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-root-${{ runner.os }}-${{ hashFiles('uv.lock', 'mise.lock') }}
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --locked
          go -C apps/cli mod download
      - name: Verify OpenAPI contract and generated clients
        run: mise run openapi:verify
      - name: Minimize uv cache
        if: ${{ always() }}
        run: uv cache prune --ci
