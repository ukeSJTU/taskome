name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.classify.outputs.cli }}
      contract: ${{ steps.classify.outputs.contract }}
      docs: ${{ steps.classify.outputs.docs }}
      e2e: ${{ steps.classify.outputs.e2e }}
      fpocket: ${{ steps.classify.outputs.fpocket }}
      gateway: ${{ steps.classify.outputs.gateway }}
      task_kit: ${{ steps.classify.outputs.task_kit }}
      typescript: ${{ steps.classify.outputs.typescript }}
      web: ${{ steps.classify.outputs.web }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
            head_sha="$HEAD_SHA"
          fi

          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]] ||
            [[ "$base_sha" == "0000000000000000000000000000000000000000" ]] ||
            ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git hash-object -t tree /dev/null)"
          fi

          mapfile -d '' changed_paths < <(git diff --name-only -z "$base_sha" "$head_sha" --)
          bash .github/scripts/classify-ci-changes.sh "${changed_paths[@]}" >>"$GITHUB_OUTPUT"

  typescript-lane:
    name: TypeScript lane
    needs: changes
    uses: ./.github/workflows/_ci-typescript.yml
    with:
      build_docs: ${{ needs.changes.outputs.docs == 'true' }}
      build_web: ${{ needs.changes.outputs.web == 'true' }}
      run_checks: ${{ needs.changes.outputs.typescript == 'true' }}

  cli-lane:
    name: CLI lane
    if: ${{ needs.changes.outputs.cli == 'true' }}
    needs: changes
    uses: ./.github/workflows/_ci-cli.yml

  python-lane:
    name: Python lane
    if: >-
      ${{
        needs.changes.outputs.gateway == 'true' ||
        needs.changes.outputs.task_kit == 'true' ||
        needs.changes.outputs.fpocket == 'true'
      }}
    needs: changes
    uses: ./.github/workflows/_ci-python.yml
    with:
      fpocket: ${{ needs.changes.outputs.fpocket == 'true' }}
      gateway: ${{ needs.changes.outputs.gateway == 'true' }}
      task_kit: ${{ needs.changes.outputs.task_kit == 'true' }}

  contract-lane:
    name: OpenAPI contract lane
    if: ${{ needs.changes.outputs.contract == 'true' }}
    needs: changes
    uses: ./.github/workflows/_ci-contract.yml

  browser-e2e-lane:
    name: Browser E2E lane
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    needs: changes
    uses: ./.github/workflows/_ci-browser-e2e.yml

  required:
    name: CI required
    if: ${{ always() }}
    needs: [changes, typescript-lane, cli-lane, python-lane, contract-lane]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful core lanes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CLI_RESULT: ${{ needs.cli-lane.result }}
          CONTRACT_RESULT: ${{ needs.contract-lane.result }}
          PYTHON_RESULT: ${{ needs.python-lane.result }}
          TYPESCRIPT_RESULT: ${{ needs.typescript-lane.result }}
        run: |
          set -Eeuo pipefail
          for result in "$CHANGES_RESULT" "$CLI_RESULT" "$CONTRACT_RESULT" "$PYTHON_RESULT" "$TYPESCRIPT_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              exit 1
            fi
          done
