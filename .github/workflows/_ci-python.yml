          key: uv-root-${{ runner.os }}-${{ hashFiles('uv.lock', 'mise.lock') }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Test task-kit
        run: mise run //packages/task-kit:test:unit
      - name: Minimize uv cache
        if: ${{ always() }}
        run: uv cache prune --ci

  task-kit-integration:
    name: task-kit integration tests
    if: ${{ inputs.task_kit }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-root-${{ runner.os }}-${{ hashFiles('uv.lock', 'mise.lock') }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Test task-kit
        run: mise run //packages/task-kit:test:integration
      - name: Minimize uv cache
        if: ${{ always() }}
        run: uv cache prune --ci

  fpocket:
    name: fpocket check and test
    if: ${{ inputs.fpocket }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-fpocket-${{ runner.os }}-${{ hashFiles('apps/task-fpocket/uv.lock', 'mise.lock') }}
      - name: Install dependencies
        run: mise run //apps/task-fpocket:sync
      - name: Check and test fpocket
        run: |
          mise run //apps/task-fpocket:check
          mise run //apps/task-fpocket:test
      - name: Minimize uv cache
        if: ${{ always() }}
        run: uv cache prune --ci
