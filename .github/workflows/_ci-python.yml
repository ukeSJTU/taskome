name: CI / Python

on:
  workflow_call:
    inputs:
      fpocket:
        required: true
        type: boolean
      gateway:
        required: true
        type: boolean
      task_kit:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  gateway-check:
    name: Gateway check
    if: ${{ inputs.gateway }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-root-${{ runner.os }}-${{ hashFiles('uv.lock', 'mise.lock') }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Check Gateway
        run: mise run //apps/gateway:check
      - name: Minimize uv cache
        if: ${{ always() }}
        run: uv cache prune --ci

  gateway-unit:
    name: Gateway unit tests
    if: ${{ inputs.gateway }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-root-${{ runner.os }}-${{ hashFiles('uv.lock', 'mise.lock') }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Test Gateway
        run: mise run //apps/gateway:test:unit
      - name: Minimize uv cache
        if: ${{ always() }}
        run: uv cache prune --ci

  gateway-integration:
    name: Gateway integration tests
    if: ${{ inputs.gateway }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-root-${{ runner.os }}-${{ hashFiles('uv.lock', 'mise.lock') }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Test Gateway
        run: mise run //apps/gateway:test:integration
      - name: Minimize uv cache
        if: ${{ always() }}
        run: uv cache prune --ci

  task-kit-check:
    name: task-kit check
    if: ${{ inputs.task_kit }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-root-${{ runner.os }}-${{ hashFiles('uv.lock', 'mise.lock') }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Check task-kit
        run: mise run //packages/task-kit:check
      - name: Minimize uv cache
        if: ${{ always() }}
        run: uv cache prune --ci

  task-kit-unit:
    name: task-kit unit tests
    if: ${{ inputs.task_kit }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
