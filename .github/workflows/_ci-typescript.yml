name: CI / TypeScript

on:
  workflow_call:
    inputs:
      build_docs:
        required: true
        type: boolean
      build_web:
        required: true
        type: boolean
      run_checks:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  format:
    name: Repository format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check repository formatting
        run: pnpm exec oxfmt --check

  check:
    name: Lint and type-check
    if: ${{ inputs.run_checks }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run TypeScript checks
        run: mise run //:ts:check

  test:
    name: Test Web
    if: ${{ inputs.build_web }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Web tests
        run: mise run //apps/web:test

  build-web:
    name: Build Web
    if: ${{ inputs.build_web }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Resolve Next.js cache generation
        id: next-cache-generation
        run: printf 'value=%s\n' "$(date -u +%G-%V)" >>"$GITHUB_OUTPUT"
      - name: Restore Web Next.js cache
        id: next-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ steps.next-cache-generation.outputs.value }}
          restore-keys: |
            next-web-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-web-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Web
        env:
          AUTH_TRUSTED_ORIGIN: http://localhost:3000
          BETTER_AUTH_SECRET: ci-only-secret-not-for-production-123456789
          BETTER_AUTH_URL: http://localhost:3000
          DATABASE_URL: postgresql://ci:ci@localhost:5432/taskome
          GATEWAY_PUBLIC_URL: http://localhost:8000
          WEB_GATEWAY_HMAC_SECRET: ci-only-web-gateway-secret-123456789
        run: mise run //apps/web:build
      - name: Save Web Next.js cache
        if: ${{ github.ref == 'refs/heads/main' && steps.next-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}

  build-docs:
    name: Build Docs
    if: ${{ inputs.build_docs }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Restore pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Resolve Next.js cache generation
        id: next-cache-generation
        run: printf 'value=%s\n' "$(date -u +%G-%V)" >>"$GITHUB_OUTPUT"
      - name: Restore Docs Next.js cache
        id: next-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/docs/.next/cache
          key: next-docs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ steps.next-cache-generation.outputs.value }}
          restore-keys: |
            next-docs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-docs-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Docs
        run: mise run //apps/docs:build
      - name: Save Docs Next.js cache
        if: ${{ github.ref == 'refs/heads/main' && steps.next-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/docs/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}
